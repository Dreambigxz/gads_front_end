<!-- CHANGE PASSWORD MODAL -->
<!-- *ngIf="showChangePassword" -->

<div
  class="password-modal-backdrop"
  (click)="closeChangePassword()">

  <div
    class="password-modal"
    (click)="$event.stopPropagation()">

    <!-- HEADER -->
    <div class="password-modal-header">

      <div class="password-modal-title">

        <div class="password-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>

        <div>
          <span>ACCOUNT SECURITY</span>
          <h3>Change Password</h3>
        </div>

      </div>

      <button
        type="button"
        class="password-close"
        (click)="closeChangePassword()">

        <i class="bi bi-x-lg"></i>

      </button>

    </div>


    <!-- MESSAGE -->
    <div class="password-message">

      <i class="bi bi-info-circle-fill"></i>

      <span>
        Use a strong password to keep your account secure.
      </span>

    </div>


    <!-- CURRENT PASSWORD -->
    <div class="password-field">

      <label>Current Password</label>

      <div class="password-input">

        <input
          [type]="showCurrentPassword ? 'text' : 'password'"
          [(ngModel)]="currentPassword"
          autocomplete="current-password"
          placeholder="Enter current password">

        <button
          type="button"
          (click)="showCurrentPassword = !showCurrentPassword">

          <i
            [class]="showCurrentPassword
              ? 'bi bi-eye-slash'
              : 'bi bi-eye'">
          </i>

        </button>

      </div>

    </div>


    <!-- NEW PASSWORD -->
    <div class="password-field">

      <label>New Password</label>

      <div class="password-input">

        <input
          [type]="showNewPassword ? 'text' : 'password'"
          [(ngModel)]="newPassword"
          autocomplete="new-password"
          placeholder="Enter new password"
          (input)="validatePassword()">

        <button
          type="button"
          (click)="showNewPassword = !showNewPassword">

          <i
            [class]="showNewPassword
              ? 'bi bi-eye-slash'
              : 'bi bi-eye'">
          </i>

        </button>

      </div>

    </div>


    <!-- CONFIRM PASSWORD -->
    <div class="password-field">

      <label>Confirm New Password</label>

      <div class="password-input">

        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          placeholder="Confirm new password"
          (input)="validatePassword()">

        <button
          type="button"
          (click)="showConfirmPassword = !showConfirmPassword">

          <i
            [class]="showConfirmPassword
              ? 'bi bi-eye-slash'
              : 'bi bi-eye'">
          </i>

        </button>

      </div>

    </div>


    <!-- PASSWORD REQUIREMENTS -->
    <div class="password-requirements">

      <div [class.valid]="newPassword.length >= 8">

        <i
          [class]="newPassword.length >= 8
            ? 'bi bi-check-circle-fill'
            : 'bi bi-circle'">
        </i>

        At least 8 characters

      </div>


      <div [class.valid]="hasNumber">

        <i
          [class]="hasNumber
            ? 'bi bi-check-circle-fill'
            : 'bi bi-circle'">
        </i>

        Contains a number

      </div>


      <div [class.valid]="hasLetter">

        <i
          [class]="hasLetter
            ? 'bi bi-check-circle-fill'
            : 'bi bi-circle'">
        </i>

        Contains a letter

      </div>


      <div [class.valid]="passwordsMatch">

        <i
          [class]="passwordsMatch
            ? 'bi bi-check-circle-fill'
            : 'bi bi-circle'">
        </i>

        Passwords match

      </div>

    </div>


    <!-- ACTIONS -->
    <div class="password-actions">

      <button
        type="button"
        class="cancel-password"
        (click)="closeChangePassword()">

        Cancel

      </button>


      <button
        type="button"
        class="update-password"
        [disabled]="!canChangePassword || changingPassword"
        (click)="changePassword()">

        <span *ngIf="!changingPassword">

          <i class="bi bi-shield-check"></i>

          Update Password

        </span>

        <span *ngIf="changingPassword">

          <i class="bi bi-arrow-repeat password-spin"></i>

          Updating...

        </span>

      </button>

    </div>

  </div>

</div>
