<nav
  class="categories-nav"
  aria-label="News categories"
>
  <div class="categories-scroll">
    @for (category of categories; track category.key) {
      <button
        type="button"
        class="category-button"
        [class.active]="activeCategory === category.key"
        [attr.aria-pressed]="activeCategory === category.key"
        (click)="selectCategory(category.key)"
        *ngIf="category.key"
      >
        <i
          class="bi"
          [ngClass]="category.icon"
        ></i>

        <span>{{ category.label | titlecase}}</span>
      </button>
    }
  </div>
</nav>

<div class="news-categories-list">
  @for (
    section of filteredNewsSections;
    track section.key;
    let index = $index
  ) {
    <app-news-list
      [section]="section"
    ></app-news-list>

    <!-- Advertisement after the first category -->
    @if (index === 0) {

      <aside
        class="promotion"
        aria-label="Advertisement"
      >
        <div class="promotion-label">
          Advertisement
        </div>

        <div class="promotion-content">
          <div class="promotion-icon">
            <i class="bi bi-megaphone-fill"></i>
          </div>

          <div class="promotion-copy">
            <span class="sponsored-label">
              Sponsored
            </span>

            <h3>Grow your business online</h3>

            <p>
              Reach more customers with fast and
              affordable digital advertising.
            </p>
          </div>

          <span
            class="promotion-button"
            (click)="openPromotion()"
            rel="noopener noreferrer"
          >
            Learn More
            <i class="bi bi-arrow-up-right"></i>
          </span>
        </div>
      </aside>
    }
  }
</div>
