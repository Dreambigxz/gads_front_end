<nav
  class="categories-nav"
  aria-label="News categories"
>
  <div class="categories-scroll">
    @for (category of categories; track category.key) {
      <button
        type="button"
        class="category-button"
        [class.active]="activeCategory === category.key"
        [attr.aria-pressed]="activeCategory === category.key"
        (click)="selectCategory(category.key)"
        *ngIf="category.key"
      >
        <i
          class="bi"
          [ngClass]="category.icon"
        ></i>

        <span>{{ category.label | titlecase}}</span>
      </button>
    }
  </div>
</nav>

<div class="news-categories-list">
  @for (
    section of filteredNewsSections;
    track section.key;
    let index = $index
  ) {
    <app-news-list
      [section]="section"
    ></app-news-list>

  }
</div>
